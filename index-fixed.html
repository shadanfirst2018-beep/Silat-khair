<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#245b48">
<title>صِلة خير</title>
<style>
:root{
 --green:#3f5f4d;--green2:#6f846f;--mint:#edf1e8;--cream:#f5efe5;--paper:#fffdf8;
 --ink:#26342d;--muted:#7c8178;--line:#e4ded2;--gold:#c9a66b;--sand:#e8d9c7;--sage:#aab5a4;--clay:#b47b5f;
 --shadow:0 18px 45px rgba(44,62,52,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d9b66f66;outline-offset:2px}
a{text-decoration:none;color:inherit}
.container{width:min(1240px,calc(100% - 40px));margin:auto}
.header{position:sticky;top:0;z-index:30;background:#fffdf9ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{min-height:76px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:900;color:var(--green)}
.brand small{display:block;color:var(--muted);font-size:9px;font-weight:600;margin-top:2px}
.brandmark{width:42px;height:42px;border-radius:14px;background:var(--mint);display:grid;place-items:center;color:var(--green);font-size:23px}
.links{display:flex;gap:22px;margin:auto;font-size:13px;font-weight:700}
.links a:hover{color:var(--green2)}
.actions{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;transition:.2s}
.btn:hover{transform:translateY(-1px)}
.primary{background:var(--green);color:#fff}
.soft{background:var(--mint);color:var(--green)}
.outline{background:transparent;color:var(--green);border:1px solid #b8c8bf}
.menu{display:none;border:0;background:var(--mint);color:var(--green);border-radius:12px;padding:10px}
.hero{margin:22px auto 26px;border-radius:30px;overflow:hidden;min-height:390px;display:grid;grid-template-columns:1.05fr .95fr;background:var(--paper);box-shadow:var(--shadow);border:1px solid var(--line)}

.hero-copy{padding:54px 56px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--green2);font-weight:900;font-size:13px}
.hero h1{font-size:clamp(36px,4.4vw,60px);line-height:1.18;margin:14px 0 12px;letter-spacing:-1px}
.hero p{font-size:16px;line-height:2;color:#59665f;max-width:620px;margin:0 0 24px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.section{padding:30px 0 100px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:18px}
.section-head h2,.title{margin:0;font-size:32px}
.muted{color:var(--muted);font-size:13px;line-height:1.8}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cat{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:10px;overflow:hidden;text-align:right;box-shadow:0 8px 24px rgba(44,62,52,.06);transition:.2s}
.cat:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.cat-img{width:100%;aspect-ratio:1.45;border-radius:15px;object-fit:cover;background:#eee}
.cat-name{padding:10px 6px 5px;font-weight:800;font-size:13px}
.cat-sub{padding:0 6px 8px;color:var(--muted);font-size:10px}
.side,.panel,.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px}
.side h3{margin-top:0}
.mini{display:grid;grid-template-columns:42px 1fr 18px;gap:8px;align-items:center;background:var(--mint);padding:13px;border-radius:15px;margin-top:10px;cursor:pointer}
.mini-icon{width:42px;height:42px;border-radius:13px;background:#fff;display:grid;place-items:center;color:var(--green);font-size:20px}
.mini small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px}
.step-num{width:38px;height:38px;border-radius:50%;background:var(--mint);color:var(--green);display:grid;place-items:center;font-weight:900;margin-bottom:14px}
.step h3{margin:0 0 7px}.step p{margin:0;color:var(--muted);font-size:12px;line-height:1.8}
.flowbar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:18px 0}
.flowbar span{padding:11px 8px;background:#ebe8df;border-radius:12px;text-align:center;font-size:11px;color:#7a817b}
.flowbar span.on{background:var(--green);color:#fff;font-weight:800}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}
.choice{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:9px;text-align:right;overflow:hidden}
.choice.sel{border:2px solid var(--green);background:var(--mint)}
.choice img{width:100%;aspect-ratio:1.5;object-fit:cover;border-radius:14px}
.choice strong{display:block;padding:10px 5px 7px;font-size:13px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:800;display:block;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:0}
.field textarea{min-height:110px;resize:vertical}
.map{height:300px;margin:14px 0;border-radius:22px;position:relative;overflow:hidden;background:
linear-gradient(25deg,transparent 47%,#cfd8ce 48%,#cfd8ce 50%,transparent 51%),
linear-gradient(120deg,transparent 45%,#d6ddd4 46%,#d6ddd4 48%,transparent 49%),
#eef1eb}
.map:before,.map:after{content:"";position:absolute;border:1px solid #c7d2c9;border-radius:50%}
.map:before{width:420px;height:220px;left:-40px;top:30px}.map:after{width:250px;height:360px;right:-50px;top:-80px}
.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50% 50% 50% 5px;transform-origin:center;rotate:-45deg;background:var(--clay);box-shadow:0 8px 20px #0002}
.pin:after{content:"";position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;left:17px;top:17px}
.map-label{position:absolute;bottom:14px;right:14px;left:14px;background:#fffdf9ee;padding:12px;border-radius:14px;text-align:center;font-size:12px;z-index:2}
.actions-row{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.thank{min-height:72vh;display:grid;place-items:center;text-align:center}
.thank .panel{max-width:680px;width:100%}
.heart{width:98px;height:98px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-size:45px;margin:auto}
.thank h1{font-size:46px;margin:16px 0 5px}.thank h2{color:var(--green2);margin:0 0 12px}
.orders{display:grid;gap:12px}
.order{display:grid;grid-template-columns:82px 1fr auto;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:12px}
.order-img{width:82px;height:72px;border-radius:15px;overflow:hidden}.order-img img{width:100%;height:100%;object-fit:cover}
.status{font-size:11px;color:var(--green2);font-weight:900}
.profile{display:grid;grid-template-columns:300px 1fr;gap:18px}
.profile-card{background:linear-gradient(150deg,var(--green),var(--sage));color:#fff;text-align:center;border-radius:24px;padding:28px}
.avatar{width:85px;height:85px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-size:40px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}.stat b{display:block;color:var(--green2);font-size:30px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.quick a{padding:18px;background:var(--paper);border:1px solid var(--line);border-radius:18px;cursor:pointer}
.bottom{display:none}
.toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:13px;font-size:12px;opacity:0;transition:.2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.lang-note{font-size:10px;color:var(--muted)}

.menu-panel{position:fixed;inset:0;background:#20332b66;backdrop-filter:blur(5px);z-index:60;display:none}
.menu-panel.show{display:block}
.menu-sheet{position:absolute;top:12px;right:12px;left:12px;max-width:420px;margin-inline:auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px #20332b25;padding:18px}
.menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.menu-head button{border:0;background:var(--mint);color:var(--green);width:38px;height:38px;border-radius:12px}
.menu-list{display:grid;gap:6px}.menu-list button{border:0;background:transparent;text-align:inherit;padding:13px 12px;border-radius:13px;color:var(--ink);font-weight:800}.menu-list button:hover{background:var(--mint);color:var(--green)}
.delete-btn{border:1px solid #e4b8b0!important;background:#fff5f3!important;color:#9a4d43!important}.delete-btn:hover{background:#ffe9e5!important}
.volunteer-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.volunteer-options button{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:15px;text-align:inherit;font-weight:800;color:var(--ink)}.volunteer-options button.sel{border-color:var(--green2);background:var(--mint);color:var(--green)}
@media(max-width:980px){.links{display:none}.menu{display:block}.grid{grid-template-columns:1fr}.profile{grid-template-columns:1fr}.categories{grid-template-columns:repeat(2,1fr)}.choices{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){
 .container{width:calc(100% - 20px)}.nav{min-height:66px}.brand{font-size:19px}.brandmark{width:36px;height:36px}
 .actions .primary{display:none}
 .hero{grid-template-columns:1fr;margin:10px auto 18px;border-radius:23px;min-height:0}
 .hero-photo{min-height:260px;order:0}.hero-copy{padding:25px 20px;order:1}.hero h1{font-size:35px}
 .hero p{font-size:13px}.section{padding-top:24px}.section-head h2,.title{font-size:27px}
 .categories,.choices{grid-template-columns:repeat(2,1fr);gap:10px}.cat-name{font-size:12px}.cat-sub{display:none}
 .steps{grid-template-columns:1fr}.flowbar span{font-size:9px;padding:9px 3px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}
 .bottom{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;height:68px;background:#fffdf9f5;border-top:1px solid var(--line);z-index:30}
 .bottom button{border:0;background:none;font-size:9px;color:#667;display:flex;flex-direction:column;align-items:center;justify-content:center}
 .bottom .donate{font-size:11px}.bottom .donate b{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin-top:-22px;font-size:20px}
 .order{grid-template-columns:58px 1fr}.order-img{width:58px;height:58px}.order .btn{grid-column:1/-1;width:100%}
 .quick{grid-template-columns:1fr}.thank h1{font-size:36px}.thank .panel{margin:10px;padding:28px 18px}
 .actions-row{position:sticky;bottom:70px;background:#f7f3ebee;padding-top:8px;z-index:4}
}
@media(min-width:981px){.hero-copy{padding-inline-start:68px}.hero-photo{order:2}.hero-copy{order:1}}
</style>

function tr(k){return T[lang][k]||k}
function catName(c){return lang==='ar'?c.ar:c.en}
function go(s){state.screen=s;state.step=1;closeMenu();render()}
function get(){try{return JSON.parse(localStorage.getItem('sila-khair-orders')||'[]')}catch{return[]}}
function save(x){localStorage.setItem('sila-khair-orders',JSON.stringify(x))}
function toggleLang(){lang=lang==='ar'?'en':'ar';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('langBtn').textContent=lang==='ar'?'EN':'ع';render();applyStatic();updateMenuText()}
function toggleMenu(){document.getElementById('menuPanel').classList.toggle('show');updateMenuText()}
function closeMenu(){document.getElementById('menuPanel')?.classList.remove('show')}
function menuGo(s){closeMenu();go(s)}
function updateMenuText(){const m=document.getElementById('menuPanel');if(!m)return;m.querySelector('[data-menu="home"]').textContent=tr('home');m.querySelector('[data-menu="donate"]').textContent=tr('donate');m.querySelector('[data-menu="orders"]').textContent=tr('orders');m.querySelector('[data-menu="help"]').textContent=tr('help');m.querySelector('[data-menu="volunteer"]').textContent=tr('volunteer');m.querySelector('[data-menu="account"]').textContent=tr('account');document.getElementById('menuLang').textContent=lang==='ar'?'English':'العربية'}
function applyStatic(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tr(e.dataset.t));document.getElementById('tagline').textContent=lang==='ar'?'فائضك.. يكمل حياة':'Your surplus can complete a life'}
function render(){if(state.screen==='home')home();else if(state.screen==='donate')donate();else if(state.screen==='orders')orders();else if(state.screen==='account')account();else if(state.screen==='thank')thank();else if(state.screen==='help')help();else if(state.screen==='volunteer')volunteer();applyStatic();updateMenuText();window.scrollTo(0,0)}

 <h1>${lang==='ar'?'لأن هناك دائماً من يحتاج… صِلة خير توصل عطاك.':'There is always someone who needs… Sila Khair connects your giving.'}</h1>
 <p>${lang==='ar'?'الأغراض اللي ما تحتاجها ممكن تصير حاجة حقيقية لشخص آخر. سجّل تبرعك، حدّد موقع الاستلام، وفريقنا يتولى التنسيق.':'Things you no longer need can become a real need for someone else. Register your donation, choose a pickup location, and our team handles the coordination.'}</p>
 <div class="hero-actions"><button class="btn primary" onclick="go('donate')">${tr('donateNow')}　✦</button><button class="btn outline" onclick="go('help')">${lang==='ar'?'كيف نعمل؟':'How it works?'}</button></div></div><div class="hero-photo"></div></section>
 <section class="section"><div class="container grid"><div><div class="section-head"><div><h2>${lang==='ar'?'شنو تحب تتبرع؟':'What would you like to donate?'}</h2><div class="muted">${lang==='ar'?'اختَر النوع وإحنا نكمل الباقي.':'Choose a category and we’ll take care of the rest.'}</div></div></div><div class="categories">${catHtml}</div>
 <div class="section-head" style="margin-top:40px"><div><h2>${lang==='ar'?'شلون يصير التبرع؟':'How does it work?'}</h2></div></div>
 <div class="steps"><div class="step"><div class="step-num">١</div><h3>${lang==='ar'?'اختر النوع':'Choose a category'}</h3><p>${lang==='ar'?'ملابس، أثاث، طعام أو أي فائض آخر.':'Clothes, furniture, food or any other surplus.'}</p></div><div class="step"><div class="step-num">٢</div><h3>${lang==='ar'?'حدّد موقع الاستلام':'Set pickup location'}</h3><p>${lang==='ar'?'فريق الاستلام يوصلك بوقت مناسب.':'Our pickup team comes at a suitable time.'}</p></div><div class="step"><div class="step-num">٣</div><h3>${lang==='ar'?'تابع الطلب':'Track your request'}</h3><p>${lang==='ar'?'كل التحديثات تجدها بصفحة طلباتي.':'All updates appear in My Orders.'}</p></div></div></div>
 <aside class="side"><h3>${lang==='ar'?'صِلة خير أقرب مما تتخيل 🤍':'Sila Khair is closer than you think 🤍'}</h3><p class="muted">${lang==='ar'?'خلّي فائضك يوصل لمن يحتاجه بخطوات بسيطة.':'Let your surplus reach someone who needs it, in a few simple steps.'}</p>
 <div class="mini" onclick="go('orders')"><span class="mini-icon">📦</span><span><b>${tr('orders')}</b><small>${lang==='ar'?'تابع حالة تبرعاتك':'Track your donations'}</small></span>←</div>
 <div class="mini" onclick="go('account')"><span class="mini-icon">♙</span><span><b>${tr('account')}</b><small>${lang==='ar'?'بياناتك وإحصائياتك':'Your details and stats'}</small></span>←</div>
 <div class="mini" onclick="go('help')"><span class="mini-icon">🤝</span><span><b>${lang==='ar'?'تحتاج مساعدة؟':'Need help?'}</b><small>${lang==='ar'?'قدّم طلب مساعدة':'Submit a help request'}</small></span>←</div>
 <div class="mini" onclick="go('volunteer')"><span class="mini-icon">🌱</span><span><b>${tr('volunteer')}</b><small>${lang==='ar'?'كن جزءاً من صِلة خير':'Be part of Sila Khair'}</small></span>←</div></aside></div></section>`;
}
function pick(key){state.category=key;go('donate')}
function donate(){
 app.innerHTML=`<section class="section"><div class="container"><div class="section-head"><div><span class="eyebrow">✦ صِلة خير</span><h1 class="title">${lang==='ar'?'سجّل تبرعك 🤍':'Register your donation 🤍'}</h1></div><button class="btn soft" onclick="go('home')">${tr('home')}</button></div>
 <div class="flowbar">${[lang==='ar'?'نوع التبرع':'Type',lang==='ar'?'تفاصيل التبرع':'Details',lang==='ar'?'موقع الاستلام':'Pickup',lang==='ar'?'تأكيد الطلب':'Confirm'].map((x,i)=>`<span class="${state.step>=i+1?'on':''}">${i+1}. ${x}</span>`).join('')}</div>
 <div class="panel">${state.step===1?step1():state.step===2?step2():state.step===3?step3():step4()}</div></div></section>`;
}
function step1(){
 return `<h2>${lang==='ar'?'ما نوع التبرع الذي تريد تقديمه؟':'What would you like to donate?'}</h2><div class="choices">${cats.map(c=>`<button class="choice ${state.category===c.key?'sel':''}" onclick="state.category='${c.key}';donate()"><img src="${c.img}" alt=""><strong>${catName(c)}</strong></button>`).join('')}</div>
 <div class="actions-row"><span></span><button class="btn primary" onclick="next(2)">${lang==='ar'?'التالي ←':'Next →'}</button></div>`;
}
function step2(){
 return `<div class="fields"><div class="field"><label>${lang==='ar'?'الاسم الكامل':'Full name'}</label><input id="name" value="${state.data.name||''}" placeholder="${lang==='ar'?'اكتب اسم المتبرع':'Enter donor name'}"></div>
 <div class="field"><label>${lang==='ar'?'رقم الهاتف':'Phone number'}</label><input id="phone" value="${state.data.phone||''}" placeholder="07xxxxxxxxx"></div>
 <div class="field"><label>${lang==='ar'?'الكمية':'Quantity'}</label><input id="quantity" value="${state.data.quantity||''}" placeholder="${lang==='ar'?'مثلاً: 3 أكياس':'e.g. 3 bags'}"></div>
 <div class="field"><label>${lang==='ar'?'وقت مناسب للاستلام':'Preferred pickup time'}</label><select id="time"><option value="any">${lang==='ar'?'أي وقت':'Any time'}</option><option value="morning">${lang==='ar'?'الصباح':'Morning'}</option><option value="afternoon">${lang==='ar'?'بعد الظهر':'Afternoon'}</option><option value="evening">${lang==='ar'?'المساء':'Evening'}</option></select></div>
 <div class="field full"><label>${lang==='ar'?'ملاحظات إضافية':'Additional notes'}</label><textarea id="notes">${state.data.notes||''}</textarea></div></div>
 <div class="actions-row"><button class="btn soft" onclick="next(1)">→ ${lang==='ar'?'السابق':'Back'}</button><button class="btn primary" onclick="collect2();next(3)">${lang==='ar'?'التالي ←':'Next →'}</button></div>`;
}
function collect2(){state.data={...state.data,name:document.getElementById('name').value,phone:document.getElementById('phone').value,quantity:document.getElementById('quantity').value,time:document.getElementById('time').value,notes:document.getElementById('notes').value}}
function step3(){
 return `<h2>${lang==='ar'?'وين نجي نستلم التبرع؟':'Where should we pick up your donation?'}</h2><div class="field"><label>${lang==='ar'?'موقع الاستلام':'Pickup location'}</label><input id="location" value="${state.data.location||''}" placeholder="${lang==='ar'?'مثلاً: النجف، حي الجامعة':'e.g. Najaf, Al-Jamiaa district'}"></div>
 <div class="map"><div class="pin"></div><div class="map-label">📍 ${lang==='ar'?'موقع الاستلام — تقدر تكتب المنطقة يدوياً':'Pickup location — you can enter your area manually'}</div></div>
 <button class="btn soft" onclick="locate()">📍 ${lang==='ar'?'استخدام موقعي':'Use my location'}</button>
 <div class="actions-row"><button class="btn soft" onclick="next(2)">→ ${lang==='ar'?'السابق':'Back'}</button><button class="btn primary" onclick="collect3();next(4)">${lang==='ar'?'التالي ←':'Next →'}</button></div>`;
}
function collect3(){state.data.location=document.getElementById('location').value}
function step4(){
 const c=cats.find(x=>x.key===state.category)||cats[0];
 return `<div style="text-align:center"><div class="heart">✓</div><h2>${lang==='ar'?'راجعي بيانات التبرع':'Review your donation'}</h2><p class="muted">${lang==='ar'?'تأكد من المعلومات قبل إرسال الطلب.':'Check the information before submitting.'}</p></div>
 <div class="card" style="box-shadow:none;background:var(--cream);line-height:2.1;display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:center"><img src="${c.img}" style="width:100px;height:75px;object-fit:cover;border-radius:14px"><div><b>${catName(c)}</b><br>${state.data.name||'-'} · ${state.data.quantity||'-'}<br>📍 ${state.data.location||'-'}</div></div>
 <div class="actions-row"><button class="btn soft" onclick="next(3)">→ ${lang==='ar'?'تعديل':'Edit'}</button><button class="btn primary" onclick="submitDonation()">${lang==='ar'?'تأكيد طلب التبرع ✓':'Confirm donation ✓'}</button></div>`;
}
function next(n){state.step=n;donate()}
function locate(){if(!navigator.geolocation){toast(lang==='ar'?'اكتب المنطقة يدوياً':'Please enter the area manually');return}navigator.geolocation.getCurrentPosition(p=>{state.data.location=`${lang==='ar'?'الموقع الحالي':'Current location'} (${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)})`;donate();toast(lang==='ar'?'تم تحديد موقعك':'Location detected')},()=>toast(lang==='ar'?'اكتب المنطقة يدوياً':'Please enter the area manually'))}
function submitDonation(){if(!state.category){toast(lang==='ar'?'اختر نوع التبرع أولاً':'Choose a donation type first');state.step=1;donate();return}const a=get();const x={id:'#'+Math.floor(1000+Math.random()*9000),date:new Date().toLocaleDateString(),category:state.category,...state.data,status:lang==='ar'?'قيد التجهيز':'Preparing'};a.unshift(x);save(a);state.data=x;state.screen='thank';render()}
function thank(){const c=cats.find(x=>x.key===state.data.category)||cats[0];app.innerHTML=`<section class="container thank"><div class="panel"><div class="heart">🤍</div><h1>${lang==='ar'?'شكراً لتبرعك':'Thank you for your donation'}</h1><h2>${lang==='ar'?'تذكر فائضُك حاجةُ غيرك':'Remember: your surplus may be someone else’s need'}</h2><p class="muted">${lang==='ar'?'تبرعك اليوم ممكن يصنع فرقاً حقيقياً بحياة شخص محتاج.':'Your donation can make a real difference in someone’s life.'}</p><div class="card" style="box-shadow:none;background:var(--mint);display:flex;align-items:center;gap:12px;text-align:start"><img src="${c.img}" style="width:70px;height:58px;object-fit:cover;border-radius:12px"><span>${lang==='ar'?'رقم الطلب':'Order number'}<br><b>${state.data.id||''}</b></span></div><div style="display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap"><button class="btn primary" onclick="go('orders')">${lang==='ar'?'متابعة طلباتي':'My orders'}</button><button class="btn soft" onclick="go('home')">${lang==='ar'?'العودة للرئيسية':'Back home'}</button><button class="btn delete-btn" onclick="deleteAndGoOrders(state.data.id)">${lang==='ar'?'حذف التبرع':'Delete donation'}</button></div></div></section>`}
function deleteDonation(id){const x=get();const item=x.find(v=>v.id===id);if(!item)return false;const msg=lang==='ar'?'هل تريد حذف هذا التبرع؟ لا يمكن التراجع بعد الحذف.':'Delete this donation? This cannot be undone.';if(window.confirm(msg)){save(x.filter(v=>v.id!==id));toast(lang==='ar'?'تم حذف التبرع':'Donation deleted');orders();return true}return false}
function deleteAndGoOrders(id){if(deleteDonation(id)){state.data={};go('orders')}}
function orders(){const a=get();app.innerHTML=`<section class="section"><div class="container"><div class="section-head"><div><h1 class="title">${tr('orders')}</h1><div class="muted">${lang==='ar'?'كل تبرعاتك وتحديثاتها بمكان واحد.':'All your donations and updates in one place.'}</div></div><button class="btn primary" onclick="go('donate')">${tr('donateNow')}</button></div>${a.length?`<div class="orders">${a.map(x=>{const c=cats.find(y=>y.key===x.category)||cats[0];return `<article class="order"><div class="order-img"><img src="${c.img}" alt=""></div><div><b>${x.id} · ${catName(c)}</b><div class="muted">${x.quantity||''} · ${x.date||''}</div><div class="status">${x.status}</div></div><div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end"><button class="btn soft" onclick='state.data=${JSON.stringify(x)};state.screen="thank";render()'>${lang==='ar'?'التفاصيل':'Details'}</button><button class="btn delete-btn" onclick="deleteDonation('${x.id}')">${lang==='ar'?'حذف التبرع':'Delete donation'}</button></div></article>`}).join('')}</div>`:`<div class="panel" style="text-align:center"><div style="font-size:50px">📦</div><h2>${lang==='ar'?'ما عندك طلبات بعد':'No orders yet'}</h2><p class="muted">${lang==='ar'?'سجّل أول تبرع وخليه بداية صِلة خير.':'Register your first donation and make it the beginning of a good connection.'}</p><button class="btn primary" onclick="go('donate')">${tr('donateNow')}</button></div>`}</div></section>`}
function account(){const a=get(),x=a[0];app.innerHTML=`<section class="section"><div class="container"><h1 class="title">${tr('account')}</h1><div class="profile"><aside class="profile-card"><div class="avatar">♙</div><h2>${x?.name|| (lang==='ar'?'مستخدم صِلة خير':'Sila Khair user')}</h2><p>${x?.phone|| (lang==='ar'?'أكمل بياناتك من أول تبرع':'Complete your details with your first donation')}</p><button class="btn" style="background:#fff;color:var(--green2);width:100%" onclick="go('donate')">${tr('donateNow')}</button></aside><div><div class="stats"><div class="stat"><b>${a.length}</b><span>${lang==='ar'?'تبرعات':'Donations'}</span></div><div class="stat"><b>${a.filter(x=>x.status.includes('تجهيز')||x.status==='Preparing').length}</b><span>${lang==='ar'?'قيد التجهيز':'Preparing'}</span></div><div class="stat"><b>${getHelps().length}</b><span>${lang==='ar'?'طلبات مساعدة':'Help requests'}</span></div></div><div class="quick"><a onclick="go('orders')">📦 ${tr('orders')}</a><a onclick="go('donate')">🎁 ${tr('donate')}</a><a onclick="go('help')">🤝 ${tr('help')}</a><a onclick="go('volunteer')">🌱 ${tr('volunteer')}</a></div></div></div></div></section>`}
function getHelps(){try{return JSON.parse(localStorage.getItem('sila-khair-help')||'[]')}catch{return[]}}
function saveHelps(x){localStorage.setItem('sila-khair-help',JSON.stringify(x))}
function submitHelp(){const name=document.getElementById('hname')?.value.trim(),phone=document.getElementById('hphone')?.value.trim(),details=document.getElementById('hdetails')?.value.trim();if(!name||!phone||!details){toast(lang==='ar'?'أكمل معلومات طلب المساعدة':'Complete the help request fields');return}const a=getHelps();a.unshift({name,phone,details,date:new Date().toLocaleDateString()});saveHelps(a);app.innerHTML=`<section class="section"><div class="container"><div class="panel" style="max-width:760px;margin:auto;text-align:center"><div class="heart">✓</div><h1 class="title">${lang==='ar'?'تم استلام طلبك':'Request received'}</h1><p class="muted">${lang==='ar'?'راح نراجع الطلب ونتواصل وياك.':'We will review the request and contact you.'}</p><button class="btn primary" onclick="go('home')">${lang==='ar'?'العودة للرئيسية':'Back home'}</button></div></div></section>`}
function help(){app.innerHTML=`<section class="section"><div class="container"><div class="panel" style="max-width:760px;margin:auto"><h1 class="title">${lang==='ar'?'كيف نساعدك؟':'How can we help?'}</h1><p class="muted">${lang==='ar'?'إذا تحتاج مساعدة، اكتب طلبك ورقم التواصل.':'If you need help, submit your request and contact number.'}</p><div class="fields"><div class="field"><label>${lang==='ar'?'اسم مقدم الطلب':'Requester name'}</label><input id="hname" placeholder="${lang==='ar'?'اكتب الاسم':'Enter name'}"></div><div class="field"><label>${lang==='ar'?'رقم الهاتف':'Phone number'}</label><input id="hphone" placeholder="07xxxxxxxxx"></div><div class="field full"><label>${lang==='ar'?'شنو تحتاج؟':'What do you need?'}</label><textarea id="hdetails" placeholder="${lang==='ar'?'اكتب تفاصيل الطلب...':'Write the request details...'}"></textarea></div></div><button class="btn primary" style="margin-top:15px" onclick="submitHelp()">${lang==='ar'?'إرسال الطلب':'Submit request'}</button></div></div></section>`}
function getVolunteers(){try{return JSON.parse(localStorage.getItem('sila-khair-volunteers')||'[]')}catch{return[]}}
function saveVolunteers(x){localStorage.setItem('sila-khair-volunteers',JSON.stringify(x))}
function chooseVolunteer(v){state.volunteerInterest=v;volunteer()}
function submitVolunteer(){const name=document.getElementById('vname')?.value.trim();const phone=document.getElementById('vphone')?.value.trim();if(!name||!phone||!state.volunteerInterest){toast(lang==='ar'?'أكمل الاسم والرقم واختر مجال التطوع':'Complete your name, phone, and choose a volunteer area');return}const a=getVolunteers();a.unshift({name,phone,interest:state.volunteerInterest,date:new Date().toLocaleDateString()});saveVolunteers(a);state.volunteerInterest='';app.innerHTML=`<section class="section"><div class="container"><div class="panel" style="max-width:760px;margin:auto;text-align:center"><div class="heart">✓</div><h1 class="title">${lang==='ar'?'تم تسجيل طلب التطوع':'Volunteer request received'}</h1><p class="muted">${lang==='ar'?'شكراً لأنك اخترت أن تكون جزءاً من الخير. راح نتواصل وياك عند الحاجة.':'Thank you for choosing to be part of the good. We will contact you when needed.'}</p><button class="btn primary" onclick="go('home')">${lang==='ar'?'العودة للرئيسية':'Back home'}</button></div></div></section>`}
function volunteer(){const selected=state.volunteerInterest;app.innerHTML=`<section class="section"><div class="container"><div class="panel" style="max-width:820px;margin:auto"><div style="text-align:center"><div style="font-size:65px">🌱</div><h1 class="title">${lang==='ar'?'كن جزءاً من الخير':'Be part of the good'}</h1><p class="muted">${lang==='ar'?'ساهم بوقتك ومهاراتك حتى توصل التبرعات لمستحقيها.':'Share your time and skills to help donations reach people who need them.'}</p></div><div class="fields"><div class="field"><label>${lang==='ar'?'اسم المتطوع':'Volunteer name'}</label><input id="vname" placeholder="${lang==='ar'?'اكتب اسم المتطوع':'Enter volunteer name'}"></div><div class="field"><label>${lang==='ar'?'رقم الهاتف':'Phone number'}</label><input id="vphone" placeholder="07xxxxxxxxx"></div></div><h3 style="margin:20px 0 8px">${lang==='ar'?'اختر مجال التطوع':'Choose a volunteer area'}</h3><div class="volunteer-options"><button class="${selected==='pickup'?'sel':''}" onclick="chooseVolunteer('pickup')">🚚 ${lang==='ar'?'مساعدة فريق الاستلام':'Pickup team'}</button><button class="${selected==='sorting'?'sel':''}" onclick="chooseVolunteer('sorting')">📦 ${lang==='ar'?'تنظيم وفرز التبرعات':'Sorting donations'}</button><button class="${selected==='community'?'sel':''}" onclick="chooseVolunteer('community')">🤝 ${lang==='ar'?'دعم المجتمع':'Community support'}</button><button class="${selected==='media'?'sel':''}" onclick="chooseVolunteer('media')">📣 ${lang==='ar'?'نشر المبادرة':'Spread the initiative'}</button></div><button class="btn primary" style="margin-top:18px;width:100%" onclick="submitVolunteer()">${lang==='ar'?'سجّل الآن':'Register now'}</button></div></div></section>`}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2100)}
render();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
</script>
</body>
</html>
